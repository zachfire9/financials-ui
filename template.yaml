AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Public-safe AWS static hosting infrastructure for the Financials UI.

Parameters:
  SiteBucketName:
    Type: String
    Default: ''
    Description: Optional globally unique S3 bucket name. Leave blank to let CloudFormation generate one.
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: CloudFront edge location price class. PriceClass_100 is the lowest-cost default.
  CustomDomainName:
    Type: String
    Default: ''
    Description: Optional custom domain for the CloudFront distribution, for example financials.example.com. Leave blank to use the generated CloudFront domain.
  CertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN for CustomDomainName. For CloudFront, the certificate must be issued in us-east-1.
  CustomDomainHostedZoneId:
    Type: String
    Default: ''
    Description: Optional Route 53 hosted zone ID for creating A/AAAA alias records for CustomDomainName. Leave blank to manage DNS manually.

Conditions:
  HasSiteBucketName:
    Fn::Not:
      - Fn::Equals:
          - Ref: SiteBucketName
          - ''
  HasCustomDomain:
    Fn::Not:
      - Fn::Equals:
          - Ref: CustomDomainName
          - ''
  HasCustomDomainHostedZoneId:
    Fn::Not:
      - Fn::Equals:
          - Ref: CustomDomainHostedZoneId
          - ''
  HasRoute53Alias:
    Fn::And:
      - Condition: HasCustomDomain
      - Condition: HasCustomDomainHostedZoneId

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::If:
          - HasSiteBucketName
          - Ref: SiteBucketName
          - Ref: AWS::NoValue
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: '${AWS::StackName}-frontend-oac'
        Description: Origin access control for the private Financials UI bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment:
          Fn::Sub: '${AWS::StackName} Financials UI static site'
        Enabled: true
        DefaultRootObject: index.html
        PriceClass:
          Ref: PriceClass
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases:
          Fn::If:
            - HasCustomDomain
            - - Ref: CustomDomainName
            - Ref: AWS::NoValue
        ViewerCertificate:
          Fn::If:
            - HasCustomDomain
            - AcmCertificateArn:
                Ref: CertificateArn
              SslSupportMethod: sni-only
              MinimumProtocolVersion: TLSv1.2_2021
            - CloudFrontDefaultCertificate: true
        Origins:
          - Id: FrontendBucketOrigin
            DomainName:
              Fn::GetAtt:
                - FrontendBucket
                - RegionalDomainName
            OriginAccessControlId:
              Fn::GetAtt:
                - FrontendOriginAccessControl
                - Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: FrontendBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              Fn::Sub: '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn:
                  Fn::Sub:
                    - 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'
                    - DistributionId:
                        Ref: FrontendDistribution

  FrontendCustomDomainAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasRoute53Alias
    Properties:
      HostedZoneId:
        Ref: CustomDomainHostedZoneId
      Name:
        Ref: CustomDomainName
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
            - FrontendDistribution
            - DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  FrontendCustomDomainIPv6AliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasRoute53Alias
    Properties:
      HostedZoneId:
        Ref: CustomDomainHostedZoneId
      Name:
        Ref: CustomDomainName
      Type: AAAA
      AliasTarget:
        DNSName:
          Fn::GetAtt:
            - FrontendDistribution
            - DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  FrontendBucketName:
    Description: S3 bucket that stores the built Financials UI dist files.
    Value:
      Ref: FrontendBucket
  FrontendDistributionId:
    Description: CloudFront distribution ID to pass to the static deploy invalidation script.
    Value:
      Ref: FrontendDistribution
  FrontendDistributionDomainName:
    Description: Generated CloudFront domain name for the static UI.
    Value:
      Fn::GetAtt:
        - FrontendDistribution
        - DomainName
  FrontendUrl:
    Description: HTTPS URL for the generated CloudFront domain.
    Value:
      Fn::Sub:
        - 'https://${DistributionDomainName}'
        - DistributionDomainName:
            Fn::GetAtt:
              - FrontendDistribution
              - DomainName
  FrontendCustomDomainUrl:
    Condition: HasCustomDomain
    Description: HTTPS URL for the configured custom domain.
    Value:
      Fn::Sub: 'https://${CustomDomainName}'
